name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Go version that the coverage gate, fuzzing and benchmarks run on.
  # Tests run on every version in the matrix.
  GO_PRIMARY: "1.26"
  NODE_PRIMARY: "22"

jobs:
  # --------------------------------------------------------------------------
  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25", "1.26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go/go.sum
            conformance/go.sum
            examples/gin-server/go.sum

      # staticcheck needs the newest Go release, so static checks run once,
      # on the primary version; the tests below run on every version.
      - name: gofmt, go vet, staticcheck
        if: matrix.go == env.GO_PRIMARY
        run: make lint-go

      - name: Unit tests (race detector)
        run: make test-go

      - name: Coverage gate (90%)
        if: matrix.go == env.GO_PRIMARY
        run: |
          make cover-go
          pct=$(cd go && go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          mkdir -p coverage-report
          echo "$pct" > coverage-report/go.txt
          echo "### Go coverage: ${pct}% of statements" >> "$GITHUB_STEP_SUMMARY"

      - name: Fuzz FuzzParse and FuzzVerify (30 s each)
        if: matrix.go == env.GO_PRIMARY
        run: make fuzz-go FUZZTIME=30s 2>&1 | tee fuzz.log

      - name: Fuzzing summary
        if: matrix.go == env.GO_PRIMARY
        run: |
          {
            echo "### Fuzzing"
            echo '```'
            grep -E '^(fuzz: elapsed: 3[0-9]s|PASS|FAIL|ok|---)' fuzz.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A failing input is written to testdata/fuzz; keep it so the failure
      # can be reproduced with plain `go test`.
      - name: Keep failing fuzz inputs
        if: failure() && matrix.go == env.GO_PRIMARY
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: go/testdata/fuzz
          if-no-files-found: ignore

      - name: Benchmarks
        if: matrix.go == env.GO_PRIMARY
        run: |
          make bench | tee bench.log
          {
            echo "### Benchmarks (cached verification)"
            echo '```'
            grep -E '^(goos|goarch|cpu|Benchmark)' bench.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: matrix.go == env.GO_PRIMARY
        with:
          name: coverage-go
          path: coverage-report/go.txt

  # --------------------------------------------------------------------------
  ts:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install
        run: cd ts && npm ci

      - name: tsc, eslint, build, example type-check
        run: make lint-ts

      # Unit, middleware and fast-check property tests, with the coverage
      # thresholds from vitest.config.ts (90% on every metric) enforced.
      - name: Tests with coverage gate (90%)
        run: make cover-ts

      - name: Record coverage
        if: matrix.node == env.NODE_PRIMARY
        run: |
          pct=$(jq -r '.total.lines.pct' ts/coverage/coverage-summary.json)
          mkdir -p coverage-report
          echo "$pct" > coverage-report/ts.txt
          echo "### TypeScript coverage: ${pct}% of lines" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: matrix.node == env.NODE_PRIMARY
        with:
          name: coverage-ts
          path: coverage-report/ts.txt

  # --------------------------------------------------------------------------
  conformance:
    name: Conformance (Go vs TypeScript)
    runs-on: ubuntu-latest
    needs: [go, ts]
    permissions:
      contents: write # only to publish the coverage badges to the badges branch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_PRIMARY }}
          cache-dependency-path: |
            go/go.sum
            conformance/go.sum
            examples/gin-server/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_PRIMARY }}
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Install
        run: cd ts && npm ci

      # Fails if fixtures.json is not what the generator produces, if either
      # runner disagrees with a fixture expectation, if the two result files
      # differ by a single byte, or if the matrix in the README is not the
      # one these results render to.
      - name: Conformance suite
        run: make conformance REPORT_FLAGS=-check

      - name: Explicit diff of the two result files
        run: |
          diff conformance/results/go.json conformance/results/ts.json
          cases=$(jq length conformance/results/go.json)
          echo "### Conformance: ${cases} cases, Go and TypeScript results identical" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: conformance-results
          path: conformance/results/*.json

      # The same comparison on tokens nobody wrote an expectation for: once
      # with a fixed seed, once with a seed that is new on every run. A
      # failure prints the seed; replay it with `make differential SEED=<seed>`.
      - name: Differential test, fixed seed
        run: make differential MUTATIONS=20000 SEED=1
      - name: Differential test, fresh seed
        run: make differential MUTATIONS=20000 SEED=${{ github.run_id }}

      - name: Example servers, end to end
        run: make examples

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-report
          merge-multiple: true

      # shields.io reads these two files from the badges branch. They are
      # written only by runs on main, from the numbers measured above.
      - name: Publish coverage badges
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go_pct=$(cat coverage-report/go.txt)
          ts_pct=$(cat coverage-report/ts.txt)
          color() { awk -v p="$1" 'BEGIN { print (p >= 90 ? "brightgreen" : p >= 75 ? "yellow" : "red") }'; }
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          git init -q -b badges out
          cd out
          printf '{"schemaVersion":1,"label":"go coverage","message":"%s%%","color":"%s"}\n' "$go_pct" "$(color "$go_pct")" > go-coverage.json
          printf '{"schemaVersion":1,"label":"ts coverage","message":"%s%%","color":"%s"}\n' "$ts_pct" "$(color "$ts_pct")" > ts-coverage.json
          printf '{"go_statement_coverage":%s,"ts_line_coverage":%s,"commit":"%s","run":"%s"}\n' "$go_pct" "$ts_pct" "$GITHUB_SHA" "$run_url" > coverage.json
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Coverage from ${run_url}"
          # The branch holds only these generated files, so each run replaces it.
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
          echo "### Coverage badges published: Go ${go_pct}%, TypeScript ${ts_pct}%" >> "$GITHUB_STEP_SUMMARY"
